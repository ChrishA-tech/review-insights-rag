name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - run: bash scripts/get_data.sh
      - run: pytest -q
      - name: Pipeline on real data (small retrieval benchmark)
        run: python -m rvi.run --val-queries 50 --test-queries 100
      - name: Agent harness (scripted router, plumbing check only)
        run: python eval/run_eval.py --backend scripted
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/get_data.sh
      - run: docker build -f deploy/Dockerfile -t rvi .
      - run: |
          docker run -d -p 8080:8080 --name rvi rvi && sleep 20
          curl -fsS localhost:8080/health
